<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sources and archives used by House of Cican for evidence-first surname research."><meta name="robots" content="index,follow"><link rel="canonical" href="https://cicangeorgealin.github.io/house-of-cican/sources.html"><title>Sources & Archives — HOUSE OF CICAN</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:42px 22px 80px}a{color:#fff}.back{color:#aaa;text-decoration:none;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase}.k{margin-top:50px;color:#bbb;letter-spacing:.28em;text-transform:uppercase;font-size:.82rem}h1{font-size:clamp(2.7rem,8vw,5.8rem);line-height:.9;letter-spacing:-.06em}.source{border:1px solid #242424;padding:20px;margin:12px 0}.source b{font-size:1rem}.source small{display:block;color:#888;margin-top:7px}.source p{color:#aaa;line-height:1.7}.source a{display:inline-block;margin-top:5px}</style></head><body><main><a class="back" href="./">← House of Cican</a><div class="k">Evidence registry</div><h1>SOURCES<br>& ARCHIVES</h1><p>Sources are evidence infrastructure, not automatically authoritative conclusions. The archive distinguishes original records, institutional catalogues, scholarly works and secondary databases.</p><div id="sources"><p>Loading source registry…</p></div><p><a href="methodology.html">Read the methodology →</a></p></main><script>const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]));fetch("data/sources.json").then(r=>r.json()).then(d=>{document.getElementById("sources").innerHTML=(d.sources||[]).map(x=>'<div class="source"><b>'+esc(x.title)+'</b><small>'+esc(x.source_id)+' · '+esc(x.source_type||"")+'</small><p>'+esc(x.publisher||"")+'</p>'+(x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">Open source ↗</a>':"")+'</div>').join("")}).catch(()=>document.getElementById("sources").innerHTML="<p>The source registry could not be loaded.</p>");</script></main></body></html>
